name: Diagnóstico FTP (manual)
on:
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Probar combinaciones de servidor y usuario
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Longitud servidor: ${#S} · longitud usuario: ${#U} · longitud contraseña: ${#P}"
          case "$U" in *" "*) echo "AVISO: el usuario contiene espacios";; esac
          case "$P" in *" "*) echo "AVISO: la contraseña contiene espacios";; esac
          echo "Usuario contiene @: $( [[ "$U" == *@* ]] && echo sí || echo no )"
          echo "Dominio del usuario: ${U#*@}"
          SHORT="${U%%@*}"
          for H in "$S" demo.tuwebexpres.com ftp.demo.tuwebexpres.com tuwebexpres.com ftp.tuwebexpres.com; do
            IP=$(getent hosts "$H" | awk '{print $1}' | head -1)
            for USR in "$U" "$SHORT"; do
              lab="usuario=$([ "$USR" = "$U" ] && echo completo || echo corto)"
              R1=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --ssl-reqd --insecure --user "$USR:$P" "ftp://$H/" -l 2>&1 || true)
              R2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --user "$USR:$P" "ftp://$H/" -l 2>&1 || true)
              H_LABEL="$H"; [ "$H" = "$S" ] && H_LABEL="(secreto FTP_SERVER)"
              echo "$H_LABEL [$IP] $lab -> FTPS:$R1 FTP:$R2"
            done
          done
          echo "Código 226 o 250 = acceso correcto; 530 = usuario/contraseña rechazados; 000 = sin conexión"
