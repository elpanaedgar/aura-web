name: Publicar AURĀ en demo.tuwebexpres.com/aura

# Sin FTP: después de cada cambio en aura/, GitHub avisa al servidor y este
# descarga la versión nueva (ver aura/actualizar.php). Requiere que el
# repositorio sea público, porque el servidor descarga sin contraseña.
on:
  push:
    branches: [main]
    paths:
      - 'aura/**'
  workflow_dispatch:

concurrency:
  group: deploy-aura
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Avisar al servidor para que descargue la versión nueva
        run: |
          sleep 5
          for i in 1 2 3; do
            code=$(curl -s -o respuesta.txt -w '%{http_code}' --max-time 120 "https://demo.tuwebexpres.com/aura/actualizar.php?sha=${GITHUB_SHA}")
            cat respuesta.txt; echo
            if [ "$code" = "200" ]; then exit 0; fi
            if [ "$code" = "404" ]; then echo "::error::Falta subir aura/actualizar.php al servidor (una sola vez)."; exit 1; fi
            echo "Intento $i: respuesta $code. Reintentando..."; sleep 20
          done
          echo "::error::El servidor no pudo actualizarse (última respuesta $code)."; exit 1
