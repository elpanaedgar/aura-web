<meta charset="utf-8">
<title>AURĀ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Demo interactiva de AURĀ, plataforma de aromaterapia y bienestar botánico con la asistente Olia.">
<meta property="og:title" content="AURĀ · Bienestar que florece desde dentro">
<meta property="og:description" content="Demo interactiva: aceites, biblioteca 3D, rituales, conocimiento botánico, Olia, espacio personal y área profesional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500&display=swap">
<style>
/* Concepto: un herbario empolvado que respira. Fondo marfil-rosa con ondas lila y trazos de oro;
   la ilustración botánica manda y el frasco de cristal ámbar es el hilo que recorre toda la plataforma. */
:root{
  color-scheme: light;
  --bg:#FCF0EC; --bg2:#F8E4E4; --blush:#F4DCE2; --lilac:#ECE0F1; --ivory:#FFF8F4;
  --ink:#442430; --plum:#603448; --mauve:#986C88; --btn:#8C5870; --btn-d:#6F4459;
  --lav:#845488; --lav-soft:#BFA6D4; --sage:#909070; --sage-d:#66704F; --gold:#C8A46A; --gold-soft:#E7D3AE;
  --amber:#884804; --muted:#6B4E5E; --line:rgba(96,52,72,.16); --glass:rgba(255,248,244,.72);
  --serif:'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif;
  --sans:'Jost', 'Helvetica Neue', Arial, sans-serif;
  --r-sm:12px; --r-md:20px; --r-lg:30px;
  --shadow:0 18px 50px rgba(96,52,72,.10); --shadow-lift:0 26px 60px rgba(96,52,72,.16);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.bgwash{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60% 50% at 85% 10%, #F1E2F2 0%, transparent 70%),
  radial-gradient(50% 45% at 5% 95%, #EEDDF0 0%, transparent 70%),
  linear-gradient(180deg, #FCF0EC 0%, #F9E7E7 55%, #F6E2EA 100%)}
a{color:var(--plum)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lav);outline-offset:3px;border-radius:6px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-weight:500;line-height:1.05;margin:0;text-wrap:balance;color:var(--plum)}
.it{font-style:italic;color:var(--mauve);font-weight:400}
.lead{font-size:1.15rem;color:var(--muted);max-width:56ch;margin:0}
.small{font-family:var(--sans);font-size:.78rem;letter-spacing:.02em;color:var(--muted)}
.demo-pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:.72rem;letter-spacing:.04em;background:#F3E3EC;color:#5C3554;border:1px solid #E6CFDD;border-radius:999px;padding:4px 10px}
.demo-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mauve)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:50px;padding:0 28px;border-radius:999px;border:1px solid transparent;font-family:var(--serif);font-size:1.12rem;font-weight:500;text-decoration:none;transition:background .3s var(--ease),transform .3s var(--ease),box-shadow .3s}
.btn-p{background:var(--btn);color:#FFF6F7;box-shadow:0 12px 26px rgba(140,88,112,.28)}
.btn-p:hover{background:var(--btn-d);transform:translateY(-1px)}
.btn-s{background:rgba(255,248,244,.55);border-color:rgba(96,52,72,.45);color:var(--plum)}
.btn-s:hover{background:var(--ivory)}
.btn-sm{min-height:42px;padding:0 18px;font-size:1rem}
.btn .ar{transition:transform .3s var(--ease)}
.btn:hover .ar{transform:translateX(4px)}
.icon-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:rgba(255,248,244,.6);display:inline-flex;align-items:center;justify-content:center}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,248,244,.65);font-family:var(--serif);font-size:1rem;color:var(--plum);transition:background .25s,color .25s,border-color .25s}
.chip[aria-pressed="true"],.chip.on{background:var(--btn);border-color:var(--btn);color:#FFF6F7}
.fav{width:42px;height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.9);background:var(--glass);backdrop-filter:blur(8px);display:inline-flex;align-items:center;justify-content:center;transition:transform .25s var(--ease)}
.fav:active{transform:scale(.9)}
.fav svg{width:19px;height:19px}
.fav[aria-pressed="true"] path{fill:#C98AA8;stroke:#A9668A}

/* Cabecera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;transition:background .3s,box-shadow .3s}
header.top.scrolled{background:rgba(252,240,236,.86);backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--line)}
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:20px;height:78px}
.logo{font-family:var(--serif);font-size:2.1rem;letter-spacing:.32em;color:var(--plum);text-decoration:none;font-weight:500;line-height:1;padding-left:.32em;background:none;border:0}
.nav{display:flex;align-items:center;gap:34px}
.nav button{background:none;border:0;font-family:var(--serif);font-size:1.08rem;color:var(--ink);padding:8px 0;position:relative}
.nav button::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--plum);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.nav button:hover::after,.nav button[aria-current="page"]::after{transform:scaleX(1)}
.top .tools{display:flex;align-items:center;gap:8px}
.top .sep{width:1px;height:28px;background:var(--line);margin:0 8px}
.burger{display:none}
.mmenu{position:fixed;inset:0;z-index:70;background:linear-gradient(180deg,#FCF0EC,#F3E2EE);padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;overflow:auto}
[hidden]{display:none !important}
.mmenu button.lk{background:none;border:0;text-align:left;font-family:var(--serif);font-size:2rem;color:var(--plum);padding:8px 0;border-bottom:1px solid var(--line)}
.mmenu .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}

/* Vistas */
.view{animation:vin .55s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sec{padding-block:110px 0}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:38px}
.sec-head h2{font-size:clamp(2.3rem,4.4vw,3.6rem)}
.page-head{padding-block:40px 30px}
.page-head h1{font-size:clamp(2.6rem,6vw,4.6rem)}
.page-head .lead{margin-top:14px}

/* Hero */
.hero{position:relative;min-height:min(820px,calc(100vh - 78px));display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:20px;padding-block:10px 40px}
.hero .waves{position:absolute;left:-12vw;bottom:-40px;width:90vw;max-width:1200px;z-index:-1;pointer-events:none}
.hero .waves path{animation:drift 18s ease-in-out infinite alternate}
.hero .waves path:nth-child(2n){animation-duration:23s}
@keyframes drift{to{transform:translateX(30px)}}
.hero .leaves{position:absolute;left:-30px;top:-90px;width:300px;z-index:-1;opacity:.95;-webkit-mask-image:radial-gradient(70% 70% at 30% 30%,#000 55%,transparent 100%);mask-image:radial-gradient(70% 70% at 30% 30%,#000 55%,transparent 100%)}
.hero .txt{text-align:center;justify-self:center;max-width:640px}
.hero .arc{width:300px;max-width:70%;margin:0 auto -8px}
.hero h1{font-size:clamp(3rem,6.2vw,5.4rem);color:var(--plum);font-weight:500;letter-spacing:-.01em}
.hero h1 .l2{display:block;font-style:italic;font-weight:400;color:var(--mauve)}
.hero h1 .w{display:inline-block;opacity:0;transform:translateY(18px);filter:blur(6px);animation:wup 1s var(--ease) forwards}
@keyframes wup{to{opacity:1;transform:none;filter:none}}
.hero .sub{font-family:var(--sans);font-size:.92rem;letter-spacing:.42em;color:var(--ink);margin:26px 0 34px;text-transform:uppercase}
.hero .ctas{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.hero .art{position:relative;align-self:stretch;min-height:520px}
.hero .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;-webkit-mask-image:radial-gradient(46% 52% at 60% 52%,#000 58%,transparent 100%);mask-image:radial-gradient(46% 52% at 60% 52%,#000 58%,transparent 100%)}
main:focus{outline:none}
.petal{position:absolute;width:26px;height:20px;z-index:2;pointer-events:none;animation:petal 9s ease-in-out infinite}
@keyframes petal{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(-18px,14px) rotate(25deg)}100%{transform:translate(0,0) rotate(0)}}
.features{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);margin-top:10px}
.features button{display:flex;gap:16px;align-items:center;text-align:left;background:none;border:0;padding:24px 18px;border-right:1px solid var(--line);font-family:var(--serif);font-size:1.05rem;line-height:1.3;color:var(--ink);transition:background .3s}
.features button:last-child{border-right:0}
.features button:hover{background:rgba(255,248,244,.55)}
.features svg{width:42px;height:42px;flex:none}

/* Tres dimensiones */
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:end}
.dim{position:relative;border:0;text-align:left;padding:0;background:none;color:inherit}
.dim .arch{border-radius:999px 999px 26px 26px;overflow:hidden;background:linear-gradient(180deg,#F6E6EE,#EFE0F0);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:transform .6s var(--ease),box-shadow .6s;border:1px solid rgba(255,255,255,.8)}
.dim:nth-child(2) .arch{aspect-ratio:3/4.4;background:linear-gradient(180deg,#F3E7DF,#F6E2E6)}
.dim:nth-child(3) .arch{aspect-ratio:3/3.7;background:linear-gradient(180deg,#E9E8DD,#F3E5EA)}
.dim:hover .arch{transform:translateY(-8px);box-shadow:var(--shadow-lift)}
.dim .arch svg{width:78%;height:auto}
.dim h3{font-size:2rem;margin-top:18px}
.dim p{margin:6px 0 0;color:var(--muted);font-size:1.05rem}

/* Carrusel de frascos */
.shelf{position:relative}
.shelf .track{display:flex;gap:26px;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px 4px 30px;scrollbar-width:none}
.shelf .track::-webkit-scrollbar{display:none}
.vial{flex:0 0 230px;scroll-snap-align:center;border:0;background:none;padding:0;text-align:center;color:inherit}
.vial .stage{position:relative;height:300px;border-radius:999px 999px 30px 30px;background:radial-gradient(70% 55% at 50% 60%,#FFF8F4 0%,rgba(255,248,244,0) 70%);display:flex;align-items:flex-end;justify-content:center}
.vial .plant{position:absolute;inset:6% 4% 18%;opacity:.95;transition:transform .8s var(--ease)}
.vial .bottle{position:relative;width:96px;margin-bottom:12px;transition:transform .6s var(--ease);filter:drop-shadow(0 16px 18px rgba(96,52,72,.18))}
.vial:hover .bottle{transform:translateY(-8px) rotate(-2deg)}
.vial:hover .plant{transform:scale(1.04) rotate(2deg)}
.vial .plinth{position:absolute;bottom:0;width:150px;height:22px;border-radius:50%;background:radial-gradient(#EADBD2,#DCC8BE 70%,transparent 72%)}
.vial b{display:block;font-weight:500;font-size:1.5rem;color:var(--plum);margin-top:12px}
.vial i{font-size:1rem;color:var(--muted)}
.shelf .nav-arrows{display:flex;gap:10px}

/* Ventana biblioteca */
.window{display:grid;grid-template-columns:1fr 1.05fr;gap:50px;align-items:center}
.porthole{position:relative;aspect-ratio:1;max-width:520px;width:100%;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 50% 45%,#FFF6F2 0%,#F4E2EC 55%,#E9D8EC 100%);box-shadow:inset 0 0 60px rgba(132,84,136,.18),var(--shadow);overflow:hidden}
.porthole .ring{position:absolute;inset:-2px;border-radius:50%;border:1px solid var(--gold);opacity:.8}
.porthole .orbit{position:absolute;inset:8%;animation:spin 60s linear infinite}
.porthole .orbit svg{width:100%;height:100%}
.porthole .center{position:absolute;left:50%;top:50%;width:21%;transform:translate(-50%,-50%);filter:drop-shadow(0 20px 22px rgba(96,52,72,.25))}
@keyframes spin{to{transform:rotate(360deg)}}

/* Día de rituales */
.dayline{position:relative;padding:20px 0 0}
.dayline svg.curve{width:100%;height:150px;display:block}
.daypoints{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:-40px}
.daypoints button{background:none;border:0;text-align:center;padding:0;color:inherit}
.daypoints .dot{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:var(--ivory);border:1px solid rgba(200,164,106,.6);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:transform .4s var(--ease)}
.daypoints button:hover .dot{transform:translateY(-6px)}
.daypoints .dot svg{width:44px;height:44px}
.daypoints b{display:block;font-weight:500;font-size:1.3rem;color:var(--plum)}
.daypoints span{font-family:var(--sans);font-size:.8rem;color:var(--muted)}

/* Olia */
.orb{position:relative;width:180px;height:180px;flex:none}
.orb .glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#FFFFFF 0%,#F7E3F0 30%,#E3CDEB 55%,rgba(227,205,235,0) 72%);animation:breathe 5s ease-in-out infinite}
.orb svg{position:absolute;inset:14%;animation:spin 40s linear infinite}
.orb.thinking .glow{animation-duration:1.4s}
@keyframes breathe{50%{transform:scale(1.08);opacity:.85}}
.olia-band{display:flex;gap:50px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,rgba(255,248,244,.75),rgba(239,224,240,.7));border:1px solid rgba(255,255,255,.9);border-radius:40px;padding:50px;box-shadow:var(--shadow)}
.olia-band .qs{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

/* Pro preview */
.pro-band{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center}
.mock{border-radius:26px;background:var(--ivory);box-shadow:var(--shadow-lift);overflow:hidden;display:grid;grid-template-columns:120px 1fr;min-height:300px;border:1px solid rgba(255,255,255,.9)}
.mock .side{background:linear-gradient(180deg,#6A3B55,#56304A);padding:18px 14px;display:flex;flex-direction:column;gap:10px}
.mock .side i{display:block;height:9px;border-radius:9px;background:rgba(255,246,247,.25)}
.mock .side i:first-child{background:var(--gold-soft);width:60%;margin-bottom:10px}
.mock .main{padding:22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:start}
.mock .tile{border-radius:14px;background:#F8ECEF;padding:12px;font-family:var(--sans);font-size:.7rem;color:var(--muted)}
.mock .tile b{display:block;font-family:var(--serif);font-size:1.6rem;color:var(--plum);font-weight:500}
.mock .wide{grid-column:1/-1;height:90px;border-radius:14px;background:linear-gradient(90deg,#F3E4EB,#EFE4F2)}

/* Recorrido inmersivo de la portada */
.journey{position:relative;height:640vh;margin-top:-78px}
.j-stage{--jbg:#F8E8EE;--jtint:#E9D6EE;position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:radial-gradient(60% 55% at 68% 48%,#FFFFFF 0%,var(--jbg) 58%,#F1E0EB 100%);transition:background-color .6s}
.j-stage .waves{position:absolute;left:-10vw;bottom:-6vh;width:120vw;max-width:none;height:46vh;z-index:0;pointer-events:none;opacity:.9}
.j-leaves{position:absolute;left:-20px;top:-6px;width:280px;z-index:0;opacity:.9;-webkit-mask-image:radial-gradient(70% 70% at 30% 30%,#000 55%,transparent 100%);mask-image:radial-gradient(70% 70% at 30% 30%,#000 55%,transparent 100%)}
.j-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.j-loading{position:absolute;inset:0;z-index:1;background:url() center/contain no-repeat}
.j-panel{--jy:0px;position:absolute;left:max(24px,6vw);top:50%;width:min(520px,42vw);transform:translateY(calc(-50% + var(--jy)));z-index:3;opacity:0;visibility:hidden}
.j-hero{width:min(640px,46vw);text-align:center;left:max(24px,4vw)}
.j-hero .arc{width:300px;max-width:70%;margin:0 auto -8px}
.j-hero h1{font-size:clamp(3rem,6vw,5.4rem);color:var(--plum);font-weight:500;letter-spacing:-.01em}
.j-hero h1 .l2{display:block;font-style:italic;font-weight:400;color:var(--mauve)}
.j-hero h1 .w{display:inline-block;opacity:0;transform:translateY(18px);filter:blur(6px);animation:wup 1s var(--ease) forwards}
.j-hero .sub{font-family:var(--sans);font-size:.92rem;letter-spacing:.42em;color:var(--ink);margin:26px 0 34px;text-transform:uppercase}
.j-hero .ctas{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.eyebrow{font-family:var(--sans);font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mauve)}
.j-big{font-size:clamp(3rem,6.4vw,5.6rem);margin-top:10px;line-height:1}
.j-latin{font-size:1.5rem;margin-top:6px}
.j-dots{display:flex;gap:8px;margin-bottom:20px}
.j-dots i{width:26px;height:3px;border-radius:3px;background:rgba(96,52,72,.18);transition:background .4s,width .4s}
.j-dots i.on{background:var(--btn);width:44px}
.ctas-l{display:flex;flex-wrap:wrap;gap:10px}
.j-rits{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.j-rits button{display:flex;justify-content:space-between;align-items:baseline;gap:16px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0;color:inherit;transition:padding .4s var(--ease),color .3s}
.j-rits b{font-weight:500;font-size:1.45rem;color:var(--muted);transition:color .3s,font-size .4s}
.j-rits span{font-family:var(--sans);font-size:.78rem;color:var(--muted)}
.j-rits button.on{padding-left:12px}
.j-rits button.on b{color:var(--plum);font-size:1.8rem}
.j-panel .qs{display:flex;flex-wrap:wrap;gap:8px}
.j-hint{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;font-family:var(--sans);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.j-hint span{animation:hint 1.8s ease-in-out infinite}
@keyframes hint{50%{transform:translateY(6px)}}
.j-prog{position:absolute;right:max(18px,2vw);top:30%;height:40%;width:2px;border-radius:2px;background:rgba(96,52,72,.12);z-index:3;overflow:hidden}
.j-prog i{position:absolute;inset:0;background:var(--btn);transform-origin:top;transform:scaleY(0)}
.journey.static{height:auto;margin-top:0}
.journey.static .j-stage{position:relative;height:auto;padding:30px 0 10px;background:none}
.journey.static .j-panel{position:relative;left:auto;top:auto;transform:none;width:auto;max-width:680px;margin:0 auto 70px;padding:0 20px;text-align:center}
.journey.static .j-dots,.journey.static .j-hint,.journey.static .j-prog,.journey.static .waves,.journey.static .j-leaves{display:none}
.j-static-img{width:min(520px,100%);margin:0 auto 10px;-webkit-mask-image:radial-gradient(50% 52% at 55% 52%,#000 58%,transparent 100%);mask-image:radial-gradient(50% 52% at 55% 52%,#000 58%,transparent 100%)}
.dim .arch.photo{background:radial-gradient(70% 60% at 50% 50%,#FFFFFF,#F4E3EC)}
.dim .arch.photo img{width:88%;height:auto;object-fit:contain}
/* Biblioteca: nombre editorial detrás del arco */
.lib-name{position:absolute;left:0;right:0;top:9%;text-align:center;font-family:var(--serif);font-style:italic;font-size:clamp(4rem,11vw,9rem);line-height:1;color:rgba(152,108,136,.16);z-index:0;pointer-events:none;white-space:nowrap}
.lib .stage3d canvas{z-index:1}
.lib .loading{bottom:0}
.fallback2d{position:absolute;inset:60px 0 40px;display:flex;align-items:flex-end;justify-content:center}
.fallback2d .bottle{width:150px}
@media (max-width:760px){
  .journey{height:600vh}

/* Oráculo botánico */
.oc-head{text-align:center}
.oc-head .lead{margin:12px auto 0}
.oc-stage{position:relative;min-height:560px;padding:10px 0 20px}
.oc-note{text-align:center;max-width:620px;margin:10px auto 0}
.oc-card{--cw:200px;width:var(--cw);aspect-ratio:5/8;perspective:1400px;position:relative}
.oc-inner{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,.7,.2,1)}
.oc-card.flipped .oc-inner{transform:rotateY(180deg)}
.oc-face{position:absolute;inset:0;border-radius:16px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px rgba(96,52,72,.18),0 2px 6px rgba(96,52,72,.08);background:#FCF7F1}
.oc-face svg{position:absolute;inset:0;width:100%;height:100%}
.oc-front{transform:rotateY(180deg)}
.oc-face::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.45) 48%,rgba(255,255,255,0) 60%);background-size:250% 100%;background-position:120% 0;pointer-events:none;transition:background-position 1.2s ease}
.oc-card:hover .oc-face::after,.oc-card.flipped .oc-front::after{background-position:-40% 0}
.oc-b-top{position:absolute;left:0;right:0;top:7.5%;text-align:center;font-family:var(--sans);font-size:calc(var(--cw) * .036);letter-spacing:.32em;text-transform:uppercase;color:#8A6A58}
.oc-b-name{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-family:var(--serif);font-size:calc(var(--cw) * .1);letter-spacing:.32em;padding-left:.32em;color:#6A4A58}
.oc-f-num{position:absolute;left:0;right:0;top:4.4%;line-height:1;text-align:center;font-family:var(--serif);font-weight:500;font-size:calc(var(--cw) * .072);color:#4A2A3A}
.oc-f-name{position:absolute;left:3%;right:3%;top:10.2%;text-align:center;font-family:var(--serif);font-weight:600;font-size:calc(var(--cw) * .074);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;line-height:1;color:#4A1F3A}
.oc-f-phr{position:absolute;left:9%;right:9%;top:84.6%;text-align:center;font-family:var(--serif);font-style:italic;font-weight:500;font-size:calc(var(--cw) * .064);line-height:1.18;color:#3E2233}
/* Bienvenida */
.oc-welcome{display:flex;flex-direction:column;align-items:center;gap:40px}
.oc-deck{position:relative;width:200px;height:320px;margin-top:20px}
.oc-deck .oc-card{position:absolute;left:0;top:0;animation:ocDeal 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * .08s);transform:translate(calc(var(--i) * 3px),calc(var(--i) * -3px)) rotate(calc((var(--i) - 2) * 2.5deg))}
.oc-deck .oc-card:last-child{animation:ocDeal 1.1s cubic-bezier(.2,.7,.2,1) both .32s,ocFloat 6s ease-in-out 1.4s infinite}
@keyframes ocDeal{from{opacity:0;transform:translateY(40px) rotate(-8deg) scale(.92)}}
@keyframes ocFloat{50%{transform:translate(12px,-20px) rotate(2deg)}}
.oc-modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;max-width:900px}
.oc-mode{display:flex;flex-direction:column;gap:6px;text-align:center;padding:24px 18px;border-radius:26px;border:1px solid rgba(200,164,106,.5);background:linear-gradient(180deg,rgba(255,250,246,.92),rgba(246,232,238,.85));box-shadow:var(--shadow);color:inherit;transition:transform .5s var(--ease),box-shadow .5s,border-color .3s}
.oc-mode:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:var(--gold)}
.oc-mode b{font-weight:500;font-size:1.55rem;color:var(--plum)}
.oc-mode span{font-family:var(--sans);font-size:.82rem;color:var(--muted)}
/* Selección */
.oc-pick{display:flex;flex-direction:column;align-items:center;gap:22px}
.oc-instr{font-size:1.35rem;color:var(--plum);text-align:center;margin:0;max-width:640px}
.oc-slots{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.oc-slot{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;width:150px}
.oc-slot-box{width:130px;aspect-ratio:5/8;border-radius:14px;border:1px dashed rgba(152,108,136,.5);background:rgba(255,248,244,.5);display:flex}
.oc-slot-box .oc-card{--cw:130px;animation:ocDrop .6s var(--ease) both}
@keyframes ocDrop{from{opacity:0;transform:translateY(60px) scale(.9)}}
.oc-slot b{font-weight:500;font-size:1.15rem;color:var(--plum);margin-top:6px}
.oc-slot span{font-family:var(--sans);font-size:.72rem;color:var(--muted)}
.oc-fan{position:relative;height:340px;width:100%;max-width:900px}
.oc-pickbtn{position:absolute;left:50%;top:20px;margin-left:-90px;border:0;padding:0;background:none;border-radius:16px;transform-origin:50% 140%;transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .5s}
.oc-pickbtn .oc-card{--cw:180px;transition:transform .4s var(--ease)}
.oc-fan.open .oc-pickbtn{transform:translateX(calc(var(--k) * 120px)) rotate(calc(var(--k) * 7deg)) translateY(calc(var(--k) * var(--k) * 6px))}
.oc-pickbtn:hover .oc-card,.oc-pickbtn:focus-visible .oc-card{transform:translateY(-22px)}
.oc-pickbtn.taken{opacity:0;pointer-events:none}
.oc-fan.open .oc-pickbtn.taken{transform:translateX(calc(var(--k) * 120px)) translateY(-120px) scale(1.08)}
.oc-pick-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* Explorar */
.oc-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:26px;margin-bottom:28px}
.oc-gridbtn{border:0;padding:0;background:none;border-radius:16px;transition:transform .5s var(--ease)}
.oc-gridbtn .oc-card{--cw:180px}
.oc-gridbtn:hover{transform:translateY(-8px)}
/* Resultado */
.oc-tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.oc-tabs button{display:flex;flex-direction:column;align-items:center;min-width:150px;padding:10px 18px;border-radius:20px;border:1px solid var(--line);background:rgba(255,248,244,.6);color:inherit}
.oc-tabs button[aria-selected="true"]{background:var(--ivory);border-color:var(--gold);box-shadow:var(--shadow)}
.oc-tabs b{font-weight:500;font-size:1.15rem;color:var(--plum)}
.oc-tabs span{font-family:var(--sans);font-size:.76rem;color:var(--muted)}
.oc-res-grid{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:44px;align-items:start}
.oc-res-card{position:sticky;top:100px;display:flex;justify-content:center;padding-top:10px}
.oc-res-card .oc-card{--cw:min(320px,78vw)}
.oc-card.rise{animation:ocRise .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes ocRise{from{transform:translateY(50px) scale(.94);opacity:0}}
.oc-panel{border-radius:34px;background:rgba(255,250,246,.82);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);padding:30px}
.oc-name{font-size:clamp(2.6rem,5vw,3.8rem);margin-top:6px}
.oc-lat{font-size:1.25rem;margin-top:4px}
.oc-kw{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.oc-kw span{font-family:var(--serif);font-style:italic;font-size:1.1rem;color:var(--mauve);border:1px solid rgba(200,164,106,.55);border-radius:999px;padding:4px 14px}
.oc-acc{border-top:1px solid var(--line)}
.oc-acc:last-of-type{border-bottom:1px solid var(--line)}
.oc-acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 2px;font-size:1.25rem;color:var(--plum);font-weight:500}
.oc-acc summary::-webkit-details-marker{display:none}
.oc-acc summary::after{content:"+";font-family:var(--sans);font-weight:400;font-size:1.3rem;color:var(--mauve);transition:transform .3s}
.oc-acc[open] summary::after{transform:rotate(45deg)}
.oc-acc > div{padding:0 2px 18px;animation:vin .4s var(--ease)}
.oc-acc p{margin:0 0 10px}
.oc-sub{font-weight:600;color:var(--plum)}
.oc-q{font-size:1.35rem;color:var(--plum)}
.oc-aff{font-size:1.6rem;font-style:italic;color:var(--mauve);line-height:1.3}
.oc-disc{font-family:var(--sans);font-size:.78rem;color:var(--muted)}
.oc-level{background:#F6ECF1;border-radius:14px;padding:10px 14px}
.oc-ev{list-style:none;padding:0;margin:8px 0 12px;display:flex;flex-direction:column;gap:12px}
.oc-ev li{display:flex;flex-direction:column;gap:6px}
.oc-evt{align-self:flex-start;font-family:var(--sans);font-size:.72rem;letter-spacing:.04em;border-radius:999px;padding:3px 10px;background:#EFE6F2;color:#4F3360}
.oc-evt.tA{background:#E3EEDF;color:#2F4A2A}.oc-evt.tB{background:#E8EBF3;color:#33405C}.oc-evt.tC{background:#F4EBDD;color:#5C4325}.oc-evt.tD{background:#F3E3EC;color:#5C3554}.oc-evt.tE{background:#F1E1E1;color:#6A3434}
.oc-refs a{font-family:var(--sans);font-size:.78rem;text-decoration:none}
.oc-legend{font-family:var(--sans);font-size:.74rem;color:var(--muted)}
.oc-prec{margin:0 0 10px;padding-left:20px}
.oc-reflist{margin:0 0 10px;padding-left:22px;font-size:.98rem}
.oc-reflist li{margin-bottom:8px}
.oc-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.oc-olia{margin-top:18px}
.oc-olia-in{display:flex;gap:16px;align-items:flex-start;border-radius:22px;background:linear-gradient(120deg,rgba(255,248,244,.9),rgba(239,224,240,.8));padding:18px;animation:vin .4s var(--ease)}
.oc-share{display:block !important;width:min(520px,100%) !important;padding:22px}
.oc-share img{width:100%;border-radius:20px;margin-bottom:16px}
@media (max-width:980px){
  .oc-res-grid{grid-template-columns:1fr;gap:26px}
  .oc-res-card{position:static}
  .oc-modes{grid-template-columns:1fr;max-width:460px}
}
@media (max-width:700px){
  .oc-fan{height:300px}
  .oc-pickbtn{margin-left:-65px}
  .oc-pickbtn .oc-card{--cw:130px}
  .oc-fan.open .oc-pickbtn{transform:translateX(calc(var(--k) * 52px)) rotate(calc(var(--k) * 9deg)) translateY(calc(var(--k) * var(--k) * 5px))}
  .oc-fan.open .oc-pickbtn.taken{transform:translateX(calc(var(--k) * 52px)) translateY(-90px)}
  .oc-slots{gap:8px}
  .oc-slot{width:104px}
  .oc-slot-box{width:96px}
  .oc-slot-box .oc-card{--cw:96px}
  .oc-panel{padding:22px 18px}
  .oc-tabs button{min-width:0;flex:1 1 30%;padding:8px}
  .oc-deck{width:170px;height:272px}
  .oc-deck .oc-card{--cw:170px}
}
@media (prefers-reduced-motion: reduce){
  .oc-inner{transition:none}
  .oc-deck .oc-card,.oc-deck .oc-card:last-child{animation:none}
}

/* AURĀ Acompaña */
.ac-crumb{background:none;border:0;padding:0;font-family:var(--sans);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mauve)}
.ac-crumb::after{content:" ›";}
.ac{display:grid;grid-template-columns:240px 1fr;border-radius:36px;overflow:hidden;box-shadow:var(--shadow-lift);border:1px solid rgba(255,255,255,.9);background:var(--ivory)}
.ac-side{background:linear-gradient(180deg,#6A3B55 0%,#4F2C44 100%);color:#FBEFF2;padding:26px 14px;display:flex;flex-direction:column;gap:4px}
.ac-side .t{font-size:1.6rem;letter-spacing:.24em;padding:0 10px}
.ac-side .s{font-family:var(--sans);font-size:.72rem;letter-spacing:.2em;color:var(--gold-soft);padding:0 10px 18px}
.ac-side button{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:none;color:#EAD9E2;font-family:var(--serif);font-size:1.08rem;transition:background .25s}
.ac-side button:hover{background:rgba(255,246,247,.08)}
.ac-side button[aria-current="page"]{background:rgba(255,246,247,.16);color:#fff}
.ac-badge{min-width:22px;height:22px;border-radius:999px;background:#E9B8C9;color:#4F2C44;font-family:var(--sans);font-size:.72rem;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.ac-badge:empty{display:none}
.ac-me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:16px 10px 0;border-top:1px solid rgba(255,255,255,.14)}
.ac-me b{display:block;font-weight:500;font-size:1.05rem}
.ac-me span{font-family:var(--sans);font-size:.7rem;color:#D9C2CF}
.ac-main{padding:30px;min-height:620px;min-width:0;background:radial-gradient(90% 60% at 100% 0%,rgba(236,224,241,.55),transparent 60%),var(--ivory)}
.ac-pane{animation:vin .4s var(--ease)}
.ac-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ac-h h2{font-size:2.4rem}
.ac-h .lead{margin-top:6px}
.ac-h .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ac-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.ac-kpi{text-align:left;border:1px solid rgba(255,255,255,.95);border-radius:22px;background:linear-gradient(160deg,#FFF9F6,#F7EAF0);padding:16px;box-shadow:0 10px 26px rgba(96,52,72,.07);transition:transform .3s var(--ease),box-shadow .3s}
.ac-kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ac-kpi span{display:block;font-family:var(--sans);font-size:.74rem;color:var(--muted);min-height:2.4em}
.ac-kpi b{display:block;font-weight:500;font-size:2.5rem;line-height:1.1;color:var(--plum);font-variant-numeric:tabular-nums}
.ac-kpi i{font-family:var(--sans);font-style:normal;font-size:.7rem;color:var(--mauve)}
.ac-kpi.warn{background:linear-gradient(160deg,#FFF4F1,#F6DCE4)}
.ac-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:18px}
.ac-wd{border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:16px;padding:10px 6px;text-align:center;transition:background .25s}
.ac-wd:hover{background:#fff}
.ac-wd span{display:block;font-family:var(--sans);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ac-wd b{display:block;font-weight:500;font-size:1.6rem;color:var(--plum);line-height:1.1}
.ac-wd i{font-family:var(--sans);font-style:normal;font-size:.66rem;color:var(--mauve)}
.ac-wd.on{background:var(--btn);border-color:var(--btn)}
.ac-wd.on span,.ac-wd.on b,.ac-wd.on i{color:#FFF6F7}
.ac-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.ac-cols.wide{grid-template-columns:1.35fr 1fr;align-items:start}
.ac-card{border-radius:24px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(96,52,72,.07);padding:20px;margin-bottom:16px;min-width:0}
.ac-cols>.ac-card,.ac-cols>div>.ac-card:last-child{margin-bottom:0}
.ac-cols>div>.ac-card{margin-bottom:16px}
.ac-card h3{font-size:1.5rem;margin-bottom:10px}
.ac-act,.ac-prow,.ac-crow,.ac-not{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ac-act:last-child,.ac-prow:last-child{border-bottom:0}
.ac-act .grow,.ac-prow .grow,.ac-crow .grow,.ac-not .grow{flex:1 1 180px;min-width:0}
.ac-act b,.ac-prow b,.ac-crow b,.ac-not b{display:block;font-weight:500;font-size:1.12rem;color:var(--ink);line-height:1.2}
.ac-act span:not(.ac-st),.ac-prow .grow span,.ac-crow .grow span,.ac-not .grow span{display:block;font-family:var(--sans);font-size:.76rem;color:var(--muted);margin-top:2px}
.ac-ic{flex:none;color:var(--lav)}
.ac-prow,.ac-crow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:inherit;border-radius:0;transition:background .2s}
.ac-prow:hover,.ac-crow:hover{background:rgba(236,224,241,.35)}
.ac-prow .bar-p{flex:0 1 110px}
.ac-prow em{font-style:normal;font-family:var(--sans);font-size:.78rem;color:var(--plum);min-width:38px;text-align:right}
.ac-prow.static:hover{background:none}
.ac-crow{padding:14px 8px;flex-wrap:nowrap}
.ac-av{width:40px;height:40px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:.8rem;letter-spacing:.04em;color:#fff;background:linear-gradient(140deg,#C49BC6,#8E6596)}
.ac-av.distribuidora{background:linear-gradient(140deg,#B3C29C,#7A8A62)}
.ac-av.pro{background:linear-gradient(140deg,#E7D3AE,#C8A46A);color:#4F2C44}
.ac-tag{font-family:var(--sans);font-size:.7rem;letter-spacing:.03em;border-radius:999px;padding:3px 10px;background:#F2E4EA;color:#5C3554;white-space:nowrap}
.ac-tag.distribuidora{background:#E7EEDD;color:#4E5C38}
.ac-st{font-family:var(--sans);font-size:.68rem;letter-spacing:.04em;border-radius:999px;padding:3px 9px;white-space:nowrap;flex:none}
.ac-st.ok{background:#E3EEDC;color:#46593A}
.ac-st.late{background:#F6D9DE;color:#8A2F48}
.ac-st.today{background:#F6E7C8;color:#7A5418}
.ac-st.next{background:#ECE3F3;color:#5B3F78}
.ac-st.pause{background:#ECE6E9;color:#6B5A63}
.chip.ac-mini{min-height:32px;padding:0 12px;font-size:.92rem}
.ac-hist{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:1rem;line-height:1.35}
.ac-hist:last-child{border-bottom:0}
.ac-hist .d,.ac-note .d{font-family:var(--sans);font-size:.7rem;color:var(--mauve);min-width:52px;padding-top:3px}
.ac-olia{background:linear-gradient(150deg,rgba(255,250,246,.9),rgba(236,224,241,.85));position:relative}
.ac-olia ul{margin:8px 0;padding-left:18px;font-size:1rem}
.ac-soon{position:absolute;top:18px;right:18px;font-family:var(--sans);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mauve);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.ac-tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ac-tools .search{min-height:48px;box-shadow:none}
.ac-tools .filters{display:flex;gap:8px;flex-wrap:wrap}
.ac-list{border-radius:24px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.95);padding:4px 14px}
.ac-list .ac-crow:last-child,.ac-list .ac-not:last-child{border-bottom:0}
.ac-not{padding:14px 4px}
.ac-not.read{opacity:.55}
.ac-newf h3{margin-bottom:12px}
.ac-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ac-form label,.ac-newf label{display:block;font-family:var(--sans);font-size:.78rem;color:var(--muted);margin-bottom:10px}
.ac-form label .inp,.ac-form label select,.ac-form label textarea,.ac-newf label .inp,.ac-newf label select{margin-top:5px}
.ac-consent{border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin:4px 0 10px}
.ac-consent legend{font-family:var(--sans);font-size:.74rem;color:var(--muted);padding:0 6px}
.ac-consent label{display:flex;gap:10px;align-items:center;font-family:var(--serif);font-size:1.02rem;color:var(--ink);margin:6px 0}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.ac-back{background:none;border:0;padding:0;margin-bottom:12px;font-family:var(--sans);font-size:.82rem;color:var(--mauve)}
.ac-fh{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.ac-fh .ac-av{width:58px;height:58px;font-size:1rem}

.ac-fh .small{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 0}
.ac-alert{border-radius:18px;background:#FBE6EA;border:1px solid #F0C6D0;color:#6E2A40;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1.02rem}
.ac-assign{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ac-assign select{width:auto;flex:1 1 200px}
.ac-tl{list-style:none;margin:8px 0;padding:0;position:relative}

.ac-tl li{display:flex;align-items:center;gap:12px;padding:9px 0;position:relative;flex-wrap:wrap}
.ac-tl .dot{width:31px;height:31px;flex:none;border-radius:50%;background:#fff;border:1px solid var(--gold-soft);display:inline-flex;align-items:center;justify-content:center;color:var(--lav);position:relative;z-index:1}
.ac-tl li.hecho .dot{background:var(--btn);border-color:var(--btn);color:#fff}
.ac-tl li.atrasado .dot{border-color:#D98C9E;color:#A23A57}

.ac-tl li.pausado{opacity:.6}
.ac-tl .grow{flex:1 1 160px;min-width:0}
.ac-tl b{display:block;font-weight:500;font-size:1.06rem;line-height:1.2}
.ac-tl .grow span{font-family:var(--sans);font-size:.72rem;color:var(--muted)}
.small-tl b{font-size:.98rem}
.ac-dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:1.02rem}
.ac-dl dt{font-family:var(--sans);font-size:.74rem;color:var(--muted);padding-top:3px}
.ac-dl dd{margin:0;word-break:break-word}
.ac-sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:1.02rem}
.ac-mat,.ac-note{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:1rem;flex-wrap:wrap}
.ac-noteform{display:flex;gap:8px;margin-top:10px}
.ac-noteform .inp{flex:1}
.ac-olia-btn{width:100%}
.ac-progs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ac-prog{border-radius:26px;background:linear-gradient(165deg,#FFFFFF,#FBF1F3);border:1px solid rgba(255,255,255,.95);box-shadow:0 12px 30px rgba(96,52,72,.08);padding:22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.ac-prog::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--pc)}
.ac-prog.paused{opacity:.75}
.ac-prog h3{font-size:1.7rem}
.ac-prog p{margin:0;color:var(--muted);font-size:1.02rem;flex:1}
.ac-ptop{display:flex;justify-content:space-between;gap:8px}
.ac-mini-tl{position:relative;height:16px;margin:6px 8px}
.ac-mini-tl::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;border-radius:2px;background:#EEDCE5}
.ac-mini-tl span{position:absolute;top:2px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--pc);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ac-title-inp{font:inherit;color:inherit;border:0;border-bottom:1px dashed var(--line);background:none;padding:0;width:100%;max-width:560px}
.ac-title-inp:focus{outline:none;border-bottom-color:var(--lav)}
.ac-ed{display:grid;grid-template-columns:minmax(260px,.9fr) 1.1fr;gap:18px;align-items:start}
.ac-etl{list-style:none;margin:0;padding:0 0 0 18px;position:relative}
.ac-etl::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;border-radius:2px;background:linear-gradient(var(--gold),var(--lav-soft))}
.ac-etl li{display:flex;align-items:center;gap:6px;margin-bottom:10px;position:relative}
.ac-etl li::before{content:"";position:absolute;left:-17px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#fff;border:2px solid var(--gold)}
.ac-etl li.on::before{background:var(--btn);border-color:var(--btn)}
.ac-stage{flex:1;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.75);border-radius:18px;padding:10px 12px;box-shadow:0 6px 16px rgba(96,52,72,.06);min-width:0;transition:border-color .2s,box-shadow .2s}
.ac-etl li.on .ac-stage{border-color:var(--lav-soft);box-shadow:0 10px 24px rgba(132,84,136,.16)}
.ac-stage .day{font-family:var(--sans);font-size:.7rem;color:#fff;background:var(--btn);border-radius:999px;padding:3px 8px;white-space:nowrap}
.ac-stage .grow{min-width:0}
.ac-stage b{display:block;font-weight:500;font-size:1.04rem;line-height:1.2;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-stage i{font-family:var(--sans);font-style:normal;font-size:.68rem;color:var(--muted)}
.ac-ord{display:flex;flex-direction:column;gap:4px}
.ac-ord .icon-btn{width:30px;height:30px;font-size:.9rem;color:var(--plum)}
.ac-ord .icon-btn:disabled{opacity:.3}
.ac-addst{margin-left:18px}
.ac-form textarea{resize:vertical}
.ac-file{position:relative;display:flex;align-items:center;margin-top:5px;min-height:48px;border-radius:16px;border:1px dashed var(--mauve);background:#fff;padding:0 14px;font-family:var(--serif);font-size:1rem;color:var(--plum);overflow:hidden}
.ac-file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ac-file span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-prev{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;align-items:start}
.ac-phone{border-radius:38px;background:#2F1C28;padding:12px;box-shadow:var(--shadow-lift)}
.ac-ph-top{background:linear-gradient(160deg,#6A3B55,#4F2C44);color:#FBEFF2;border-radius:28px 28px 8px 8px;padding:16px 18px}
.ac-ph-top b{display:block;font-weight:500;font-size:1.15rem}
.ac-ph-top span{font-family:var(--sans);font-size:.7rem;color:#E0CAD6}
.ac-ph-body{background:#F8EEEF;border-radius:8px 8px 28px 28px;padding:12px;max-height:520px;overflow:auto}
.ac-day{text-align:center;font-family:var(--sans);font-size:.66rem;color:var(--muted);margin:12px 0 6px}
.ac-bub{background:#fff;border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:.98rem;line-height:1.35;box-shadow:0 2px 6px rgba(96,52,72,.06);margin-bottom:6px}
.ac-bub em{display:block;font-style:normal;font-family:var(--sans);font-size:.62rem;color:var(--mauve);margin-top:6px;text-align:right}
.ac-bub.task{background:#F6E7C8;color:#5C4214;font-family:var(--sans);font-size:.74rem;display:flex;gap:6px;align-items:center}
.ac-attch{display:flex;gap:6px;align-items:center;margin-top:8px;background:#F4E8EE;border-radius:10px;padding:7px 9px;font-family:var(--sans);font-size:.72rem;color:var(--plum)}
.ac-checks{margin:0;padding-left:18px;font-size:1.02rem}
.ac-calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ac-calh b{font-weight:500;font-size:1.4rem;color:var(--plum);text-transform:capitalize}
.ac-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.ac-cal .wd{text-align:center;font-family:var(--sans);font-size:.7rem;color:var(--muted);padding:4px 0}
.ac-cd{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;min-width:0}
.ac-cd b{font-weight:500;font-size:1.02rem;color:var(--ink)}
.ac-cd.out{opacity:.4}
.ac-cd.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.ac-cd.sel{background:var(--btn)}
.ac-cd.sel b{color:#fff}
.ac-cd .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:8px}
.ac-cd .dots i{width:7px;height:7px;border-radius:50%;background:var(--pc)}
.ac-cd .dots i.hecho{opacity:.4}
.ac-cd .dots i.atrasado{box-shadow:0 0 0 1.5px #D9667F}
.ac-cd .dots em{font-style:normal;font-family:var(--sans);font-size:.55rem;color:var(--muted)}
.ac-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-family:var(--sans);font-size:.72rem;color:var(--muted)}
.ac-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.ac-perm td.c,.ac-perm th{text-align:center}
.ac-perm th:first-child,.ac-perm td:first-child{text-align:left}
.ac-yes{color:#4E7A3E;font-weight:600}
.ac-no{color:#BBA4B0}
.ac-roleview{margin-top:14px;border-radius:18px;background:rgba(236,224,241,.35);padding:14px 16px;font-size:1.02rem}
.ac-roleview p{margin:0 0 8px}
.ac-foot{margin-top:16px;text-align:center}
.pro .pside button.ac-link{margin:0 0 10px;background:linear-gradient(120deg,rgba(231,211,174,.28),rgba(255,246,247,.1));color:#fff;border:1px solid rgba(231,211,174,.45)}
.pro .pside button.ac-link em{font-style:normal;font-family:var(--sans);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;background:var(--gold-soft);color:#4F2C44;border-radius:999px;padding:2px 7px;margin-left:auto}
.ac-promo{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-radius:24px;background:linear-gradient(120deg,#FFF6F1,#EFE2F1);border:1px solid rgba(255,255,255,.95);padding:18px 20px;margin:18px 0}
.ac-promo div{flex:1 1 260px}
.ac-promo b{display:block;font-weight:500;font-size:1.5rem;color:var(--plum)}
@media (max-width:1180px){ .ac-kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:980px){
  .ac{grid-template-columns:1fr;border-radius:28px}
  .ac-side{flex-direction:row;overflow-x:auto;padding:12px;gap:6px;scrollbar-width:none}
  .ac-side::-webkit-scrollbar{display:none}
  .ac-side .t,.ac-side .s,.ac-me{display:none}
  .ac-side button{flex:none;white-space:nowrap;min-height:40px}
  .ac-cols,.ac-cols.wide,.ac-ed,.ac-prev{grid-template-columns:1fr}
}
@media (max-width:700px){
  .ac-main{padding:18px 14px}
  .ac-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ac-kpi b{font-size:2rem}
  .ac-week{grid-template-columns:repeat(7,minmax(64px,1fr));overflow-x:auto;padding-bottom:4px}
  .ac-grid2{grid-template-columns:1fr}
  .ac-h h2,.ac-fh h2{font-size:1.9rem}
  .ac-crow{flex-wrap:wrap}
  .ac-crow .ac-ring{display:none}
  .ac-prow .bar-p{display:none}
  .ac-card{padding:16px}
  .ac-cd{border-radius:9px;padding:4px 1px}
  .ac-cd b{font-size:.9rem}
}
.kind-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.kind{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.7);font-family:var(--serif);font-size:1.3rem;color:var(--plum);transition:background .25s,color .25s}
.kind span{font-family:var(--sans);font-size:.74rem;background:#F2E4EA;color:#5C3554;border-radius:999px;padding:3px 9px}
.kind[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:#FFF6F7}
.kind[aria-pressed="true"] span{background:rgba(255,255,255,.22);color:#fff}
.blend-ing{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.blend-ing .chip{min-height:36px;font-size:.98rem}
.chip.off{opacity:.6;cursor:default;border-style:dashed}
.bottle.bl{position:relative;display:inline-block;line-height:0;vertical-align:bottom}
.bottle.bl img{width:100%;height:auto;display:block}
.bottle.bl .blab{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
/* Pie */
footer{margin-top:120px;padding-block:50px calc(40px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
footer .cols{display:flex;flex-wrap:wrap;justify-content:space-between;gap:30px;align-items:flex-start}
footer .links{display:flex;flex-wrap:wrap;gap:6px 22px}
footer .links button{background:none;border:0;font-family:var(--serif);font-size:1.02rem;color:var(--plum);padding:4px 0}
footer p{margin:0}

/* Catálogo */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:26px}
.search{flex:1 1 320px;display:flex;align-items:center;gap:10px;min-height:54px;padding:0 20px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-family:var(--serif);font-size:1.12rem;color:var(--ink)}
.search input::placeholder{color:#8E7484}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{position:relative;border-radius:28px;background:linear-gradient(180deg,rgba(255,248,244,.9),rgba(248,232,236,.85));border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);overflow:hidden;transition:transform .6s var(--ease),box-shadow .6s}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lift)}
.card .open{display:block;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit}
.card .pic{position:relative;height:250px;display:flex;align-items:flex-end;justify-content:center}
.card .pic .plant{position:absolute;inset:4% 6% 14% 30%}
.card .pic .bottle{position:relative;width:84px;margin:0 0 18px -90px;filter:drop-shadow(0 14px 16px rgba(96,52,72,.2))}
.card .body{padding:4px 22px 22px}
.card h3{font-size:1.8rem}
.card .lat{font-style:italic;color:var(--muted)}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-family:var(--sans);font-size:.74rem;letter-spacing:.03em;border-radius:999px;padding:4px 10px;background:#F2E4EA;color:#5C3554}
.card .fav{position:absolute;top:14px;right:14px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;border:1px dashed rgba(96,52,72,.25);border-radius:28px}

/* Ficha */
.dlg{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(68,36,48,.28);backdrop-filter:blur(6px);animation:fade .3s}
@keyframes fade{from{opacity:0}}
.dlg .panel{position:relative;width:min(1040px,100%);max-height:100%;overflow:auto;border-radius:34px;background:linear-gradient(160deg,#FFF8F4,#F7E7EC);box-shadow:0 40px 90px rgba(68,36,48,.3);display:grid;grid-template-columns:.9fr 1.1fr;animation:pop .45s var(--ease)}
@keyframes pop{from{transform:translateY(20px) scale(.98);opacity:0}}
.dlg .vis{position:relative;min-height:440px;background:radial-gradient(70% 60% at 50% 55%,#FFFFFF,#F2E1EC 70%);display:flex;align-items:flex-end;justify-content:center;border-radius:34px 0 0 34px}
.dlg .vis .plant{position:absolute;inset:6% 6% 16%}
.dlg .vis .bottle{position:relative;width:118px;margin-bottom:30px;filter:drop-shadow(0 18px 20px rgba(96,52,72,.22))}
.dlg .info{padding:40px 40px 34px}
.dlg .close{position:absolute;top:16px;right:16px;z-index:2}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:18px;overflow:hidden;margin:20px 0}
.facts div{background:rgba(255,248,244,.92);padding:12px 16px}
.facts dt{font-family:var(--sans);font-size:.74rem;color:var(--muted);letter-spacing:.03em}
.facts dd{margin:2px 0 0;font-size:1.08rem}
.caution{border-radius:18px;background:#F1DEE6;color:#4E2A42;padding:14px 18px;font-size:1.02rem;margin-top:14px}
.dlg .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

img.bottle{height:auto}
.dlg .vis{overflow:hidden}
.porthole .center .bottle{width:100%}
/* Compliance */
.comp-line{margin:12px 0 0;font-size:.92rem;color:var(--plum)}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.comp{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;padding-bottom:40px}
.comp-card{padding:24px;border-radius:22px;background:rgba(255,255,255,.7);border:1px solid var(--line)}
.comp-card h2{font-size:1.9rem;margin-bottom:10px}
.comp-card ul{margin:0;padding-left:18px;display:grid;gap:10px}
/* Usos tradicionales */
.topic-row .filters{row-gap:8px}
@media (max-width:760px){.topic-row .filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-right:-16px;padding-right:16px;scrollbar-width:none}.topic-row .filters::-webkit-scrollbar{display:none}.topic-row .chip{flex:0 0 auto}}
.topic-note{margin:0 0 14px;padding:12px 16px;border-radius:14px;background:rgba(132,84,136,.08);border:1px solid var(--line);font-size:.92rem;line-height:1.5}
.usos-trad{margin:16px 0 14px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.6);border:1px solid var(--line)}
.ut-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip-sm{min-height:34px;padding:0 12px;font-size:.92rem}
/* Biblioteca: 3D arriba, catálogo abajo */
.lib-h{font-size:clamp(2rem,4vw,2.8rem)}
.lib-top{margin:26px 0 18px}.lib-top .lead{margin-top:8px;max-width:640px}
.cat-head{padding-top:56px;padding-bottom:18px;scroll-margin-top:84px}
/* Selector Catálogo / 3D */
.lib-switch{display:inline-flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.72)}
.lib-switch button{border:0;background:transparent;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;font-size:1rem;color:var(--plum);transition:background .25s,color .25s}
.lib-switch button[aria-pressed="true"]{background:var(--plum);color:#fff}
.lib-switch button:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
/* Biblioteca 3D */
.lib{position:relative;display:grid;grid-template-columns:1fr 330px;gap:24px;align-items:stretch}
.lib .stage3d{position:relative;height:700px;border-radius:40px;overflow:hidden;background:radial-gradient(58% 50% at 50% 36%,#FFFFFF 0%,#F9ECEF 42%,#EEDDF0 100%);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow)}
.lib canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.lib canvas.drag{cursor:grabbing}
.lib .badge3d{position:absolute;left:18px;top:18px;z-index:3}
.lib .hint{position:absolute;right:18px;top:18px;z-index:3;font-family:var(--sans);font-size:.78rem;color:var(--muted);background:var(--glass);border-radius:999px;padding:6px 12px}
.lib .loading{position:absolute;inset:0 0 240px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--muted);z-index:1}
.ring{--cw:150px;position:absolute;left:0;right:0;bottom:0;height:250px;z-index:2;background:linear-gradient(180deg,rgba(255,248,244,0) 0%,rgba(255,248,244,.6) 45%,rgba(250,238,242,.85) 100%)}
.rtrack{position:relative;display:flex;gap:16px;align-items:flex-end;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:30px;outline:none}
.rtrack::-webkit-scrollbar{display:none}
.rtrack::before,.rtrack::after{content:"";flex:0 0 calc(50% - var(--cw) / 2 - 16px)}
.rtrack:focus-visible{box-shadow:inset 0 0 0 2px var(--lav)}
.rc{position:relative;flex:0 0 var(--cw);height:calc(var(--cw) * 1.32);scroll-snap-align:center;border:0;padding:0;border-radius:999px 999px 20px 20px;background:linear-gradient(180deg,#FFFDFB 0%,#F7E8EF 100%);box-shadow:0 14px 30px rgba(96,52,72,.15);overflow:hidden;color:inherit;text-align:center;transform-origin:50% 100%;will-change:transform,opacity}

.rc .rp{position:absolute;left:8%;right:8%;top:7%;bottom:30%}

.rc i{position:absolute;left:0;right:0;bottom:11px;font-size:calc(var(--cw) / 18);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px}
.lib .side{border-radius:32px;background:var(--glass);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);padding:26px;display:flex;flex-direction:column;gap:10px}
.lib .side h2{font-size:2.6rem}
.picker{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.fallback2d{position:absolute;left:0;right:0;top:50px;bottom:240px;display:flex;align-items:flex-end;justify-content:center}
.fallback2d .plant{position:absolute;inset:0 18% 12%}
.fallback2d .bottle{position:relative;width:140px;filter:drop-shadow(0 18px 20px rgba(96,52,72,.22))}
.catalog-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.catalog-list button{display:flex;gap:12px;align-items:center;text-align:left;border-radius:20px;border:1px solid var(--line);background:rgba(255,248,244,.7);padding:12px;color:inherit}
.catalog-list button svg{width:44px;height:auto;flex:none}
@media (max-width:980px){

}

/* Rituales */
.rit{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:start}
.rit-list{display:flex;flex-direction:column;gap:8px}
.rit-list button{display:flex;align-items:center;gap:14px;text-align:left;border-radius:22px;border:1px solid var(--line);background:rgba(255,248,244,.6);padding:12px 14px;color:inherit;transition:background .3s,border-color .3s}
.rit-list button[aria-selected="true"]{background:var(--ivory);border-color:var(--gold);box-shadow:var(--shadow)}
.rit-list svg{width:44px;height:44px;flex:none}
.rit-list b{display:block;font-weight:500;font-size:1.25rem;color:var(--plum)}
.rit-list span{font-family:var(--sans);font-size:.78rem;color:var(--muted)}
.rit-panel{display:grid;grid-template-columns:.95fr 1.05fr;gap:34px;border-radius:38px;background:linear-gradient(150deg,rgba(255,248,244,.92),rgba(244,226,236,.85));border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);padding:30px;animation:vin .5s var(--ease)}
.rit-art{border-radius:999px 999px 28px 28px;overflow:hidden;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.rit-art svg{width:100%;height:100%}
.steps{counter-reset:s;list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--plum)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}

/* Conocimiento */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:28px;scrollbar-width:thin}
.tabs button{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,248,244,.6);font-family:var(--serif);font-size:1.05rem;color:var(--plum)}
.tabs button[aria-selected="true"]{background:var(--plum);color:#FFF6F7;border-color:var(--plum)}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.plate{border:0;padding:20px;border-radius:24px;background:#FFF9F5;box-shadow:var(--shadow);text-align:left;color:inherit;position:relative;transition:transform .5s var(--ease)}
.plate:hover{transform:translateY(-5px)}
.plate::after{content:"";position:absolute;inset:8px;border:1px solid rgba(200,164,106,.45);border-radius:18px;pointer-events:none}
.plate .pl{height:200px}
.plate b{display:block;font-weight:500;font-size:1.5rem;color:var(--plum)}
.wheel-wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.wheel{width:100%;max-width:460px;margin:0 auto;display:block}
.wheel path.seg{cursor:pointer;transition:opacity .3s,transform .3s;transform-origin:230px 230px}
.wheel path.seg:hover,.wheel path.seg.on{transform:scale(1.03)}
.diagram{border-radius:30px;background:#FFF9F5;box-shadow:var(--shadow);padding:26px;margin-bottom:24px}
.diagram svg{width:100%;height:auto;display:block}
.timeline{position:relative;list-style:none;margin:0;padding:0 0 0 34px;border-left:1px solid var(--gold)}
.timeline li{position:relative;padding:0 0 30px}
.timeline li::before{content:"";position:absolute;left:-41px;top:8px;width:13px;height:13px;border-radius:50%;background:var(--ivory);border:1px solid var(--gold)}
.timeline b{font-weight:500;font-size:1.4rem;color:var(--plum)}
.guide{display:flex;gap:18px;align-items:center;border-radius:22px;background:#FFF9F5;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:12px;flex-wrap:wrap}
.bar-p{height:6px;border-radius:6px;background:#EEDCE5;overflow:hidden;flex:1 1 160px}
.bar-p i{display:block;height:100%;background:var(--btn);border-radius:6px;transition:width .6s var(--ease)}
.reserved{border:1px dashed var(--mauve);border-radius:30px;padding:34px;background:rgba(255,248,244,.6)}

/* Chat Olia */
.chat{display:grid;grid-template-columns:320px 1fr;gap:30px;align-items:start}
.chat-side{position:sticky;top:100px;text-align:center;border-radius:36px;background:var(--glass);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);padding:30px 24px}

.chat-main{border-radius:36px;background:rgba(255,248,244,.7);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:620px;overflow:hidden}
.log{flex:1;padding:26px;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:62vh}
.msg{max-width:78%;padding:14px 18px;font-size:1.07rem;line-height:1.55;animation:vin .4s var(--ease)}
.msg.olia{align-self:flex-start;background:#FFFFFF;border:1px solid #F1E2EA;border-radius:22px 22px 22px 6px;box-shadow:0 10px 30px rgba(96,52,72,.06)}
.msg.me{align-self:flex-end;background:var(--btn);color:#FFF6F7;border-radius:22px 22px 6px 22px}
.msg .src{display:inline-block;margin-top:10px;font-family:var(--sans);font-size:.72rem;color:#4E5A3C;background:#E9EBDD;border-radius:999px;padding:3px 10px}
.msg .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.typing{align-self:flex-start;display:flex;gap:5px;padding:16px 18px;background:#fff;border-radius:22px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--lav-soft);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{transform:translateY(-5px);opacity:.5}}
.composer{border-top:1px solid var(--line);padding:16px 18px}
.composer .sugg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.composer form{display:flex;gap:10px}
.composer input{flex:1;min-width:0;min-height:52px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 20px;font-family:var(--serif);font-size:1.08rem;color:var(--ink)}

/* Mi espacio y Profesionales */
.space{display:grid;grid-template-columns:250px 1fr;gap:30px;align-items:start}
.vtabs{display:flex;flex-direction:column;gap:6px;position:sticky;top:100px}
.vtabs button{display:flex;justify-content:space-between;align-items:center;text-align:left;min-height:48px;padding:0 16px;border-radius:16px;border:1px solid transparent;background:none;font-family:var(--serif);font-size:1.12rem;color:var(--plum)}
.vtabs button[aria-selected="true"]{background:var(--ivory);border-color:rgba(200,164,106,.5);box-shadow:var(--shadow)}
.vtabs .count{font-family:var(--sans);font-size:.74rem;background:#F2E4EA;border-radius:999px;padding:2px 9px;color:#5C3554}
.pane{border-radius:34px;background:rgba(255,248,244,.75);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);padding:32px;min-height:420px;animation:vin .45s var(--ease)}
.pane h2{font-size:2.4rem;margin-bottom:6px}
.rows{display:flex;flex-direction:column}
.rowi{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rowi svg.mini{width:42px;height:auto;flex:none}
.rowi .grow{flex:1 1 200px;min-width:0}
.switch{width:50px;height:30px;border-radius:999px;border:0;padding:3px;display:inline-flex;justify-content:flex-start;background:#DCC9D2;transition:background .25s;flex:none}
.switch[aria-checked="true"]{justify-content:flex-end;background:var(--btn)}
.switch::after{content:"";width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
textarea,select,.inp{font-family:var(--serif);font-size:1.05rem;color:var(--ink);border-radius:16px;border:1px solid var(--line);background:#fff;padding:12px 14px;width:100%}
.diary{background:repeating-linear-gradient(180deg,transparent 0 35px,rgba(96,52,72,.12) 35px 36px);line-height:36px;padding-top:2px;resize:vertical;min-height:144px}
.entry{border-radius:20px;background:#FFFBF8;padding:16px 18px;margin-bottom:12px;border:1px solid #F1E3E8}
.entry .d{font-family:var(--sans);font-size:.76rem;color:var(--muted)}
.pro{display:grid;grid-template-columns:260px 1fr;gap:0;border-radius:36px;overflow:hidden;box-shadow:var(--shadow-lift);border:1px solid rgba(255,255,255,.9);background:var(--ivory)}
.pro .pside{background:linear-gradient(180deg,#6A3B55 0%,#4F2C44 100%);color:#FBEFF2;padding:26px 16px;display:flex;flex-direction:column;gap:4px}
.pro .pside .t{font-size:1.6rem;letter-spacing:.24em;padding:0 10px}
.pro .pside .s{font-family:var(--sans);font-size:.72rem;letter-spacing:.2em;color:var(--gold-soft);padding:0 10px 18px}
.pro .pside button{display:flex;align-items:center;gap:10px;text-align:left;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:none;color:#EAD9E2;font-family:var(--serif);font-size:1.06rem}
.pro .pside button[aria-selected="true"]{background:rgba(255,246,247,.14);color:#fff}
.pro .pmain{padding:30px;min-height:560px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0 24px}
.stat{border-radius:20px;background:#F9EDF0;padding:16px}
.stat span{font-family:var(--sans);font-size:.76rem;color:var(--muted)}
.stat b{display:block;font-weight:500;font-size:2.2rem;color:var(--plum);font-variant-numeric:tabular-nums}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{border-radius:22px;background:#F8EEF1;padding:14px;min-height:220px}
.col h4{margin:0 0 10px;font-weight:500;font-size:1.2rem;color:var(--plum)}
.kcard{border-radius:14px;background:#fff;padding:12px;margin-bottom:10px;box-shadow:0 6px 16px rgba(96,52,72,.06)}
.kcard .kb{display:flex;gap:6px;margin-top:8px}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tier{border-radius:26px;background:#FFF9F6;border:1px solid #F0E1E7;padding:24px;display:flex;flex-direction:column;gap:8px}
.tier.feat{border-color:var(--gold);box-shadow:var(--shadow)}
.tier ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:1.02rem}
table.t th{font-family:var(--sans);font-size:.74rem;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:500;padding:10px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:12px 8px;border-bottom:1px solid var(--line)}
.scroll-x{overflow-x:auto}

/* Sobre */
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.pillar{text-align:center;padding:30px 24px;border-radius:999px 999px 30px 30px;background:linear-gradient(180deg,rgba(255,248,244,.95),rgba(244,228,236,.8));box-shadow:var(--shadow)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--plum);color:#FFF6F7;font-family:var(--sans);font-size:.9rem;border-radius:999px;padding:12px 22px;box-shadow:0 18px 40px rgba(68,36,48,.3);animation:vin .3s}

}

function acPlan(c){
  var p = c.program ? acProg(c.program) : null, T = acToday();
  if (!p) return [];
  return p.steps.slice().sort(function(a, b){ return a.day - b.day; }).map(function(st){
    var due = acAdd(c.joined, st.day - 1), d = acDiff(due, T), del = c.delivered[st.id];
    var state = del ? 'hecho' : (d < 0 ? 'atrasado' : (d === 0 ? 'hoy' : 'proximo'));
    if (!del) { if (c.paused) state = 'pausado'; else if (p.paused) state = 'pausado'; }
    return {c:c, p:p, st:st, due:due, state:state, del:del};
  });
}
function acProgress(c){ var pl = acPlan(c); if (!pl.length) return 0; return Math.round(pl.filter(function(x){ return x.state === 'hecho'; }).length / pl.length * 100); }
